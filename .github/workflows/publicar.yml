name: Publicar app en GitHub Pages

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/publicar.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Pages publica solo la app y el catálogo; los mapas (~870 MB) se bajan directo del repositorio.
      - run: |
          mkdir -p _site/datos
          rsync -a --exclude datos app/ _site/
          cp app/datos/catalogo.json _site/datos/
          touch _site/.nojekyll
          du -sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          # El sitio incluye ~870 MB de mapas: copiarlos a Pages tarda más que los 10 minutos por defecto.
          timeout: 3600000
